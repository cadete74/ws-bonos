services:
  ws-bonos:
    build: .
    container_name: ws-bonos
    restart: unless-stopped

    # Variables (si usás .env, se cargan acá)
    env_file:
      - .env

    # Uvicorn escucha en 8000 dentro del contenedor; exponemos 8010 en el host
    ports:
      - "8010:8000"

    # Persistencia: la base queda en ./data del host (dentro del contenedor es /app/data)
    volumes:
      - ./data:/app/data

    networks:
      - shared-net

    # Healthcheck simple
    healthcheck:
      test: >
        python - <<'PY'
        import urllib.request,sys
        try:
            urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
            sys.exit(0)
        except Exception:
            sys.exit(1)
        PY
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

